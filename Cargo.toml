[package]
name = "ballistics"
version = "0.1.0"
description = "A Kalman filter ballistic curve estimation playground"
edition = "2024"
license = "EUPL-1.2"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
repository = "https://github.com/sunsided/ballistics"
keywords = ["kalman-filter", "estimation"]

[dependencies]
ggez = { version = "0.9.3", default-features = false }
minikalman = { version = "0.6.0", features = ["std"] }
rand = "0.10.1"
rand_distr = "0.6.0"
